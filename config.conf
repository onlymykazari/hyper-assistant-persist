# ================================================================
# HyperOS 助手持久化 - 配置文件（可随意修改，重启后生效）
# ================================================================

# power_button_long_press 的目标值
# 5 = 数字助理（GeminiMi 项目在国行 HyperOS 上实测值）
# 2 = 电源菜单(关机菜单)，1 = 无操作
# 如果你的机型数值不同：在“原生开关强开后、还没重启”时执行
#   settings get global power_button_long_press
# 把输出的数字填到这里即可。
PBL_VALUE=5

# 双保险：同时向 Secure 命名空间写入同名键（1=开）
ALSO_WRITE_SECURE=1

# 助手相关键被系统写回小爱/清空时，自动修复为下面的谷歌组件（1=开）
FIX_ASSISTANT=1

# 无条件强制覆盖助手键（1=每次巡检都写，0=只在被破坏时修复）
# 注意：若以后想换别的助手（如小爱），先改为 0，否则会被抢回
FORCE_ASSISTANT=0

# 谷歌数字助理组件（谷歌 App / Gemini 共用）
ASSISTANT_COMPONENT=com.google.android.googlequicksearchbox/com.google.android.voiceinteraction.GsaVoiceInteractionService
RECOGNITION_COMPONENT=com.google.android.googlequicksearchbox/com.google.android.voicesearch.serviceapi.GoogleRecognitionService
ASSISTANT_PACKAGE=com.google.android.googlequicksearchbox

# 助手读屏/截图能力开关（数字助理弹窗里显示屏幕内容）
ASSIST_STRUCTURE=1
ASSIST_SCREENSHOT=1

# 巡检节奏（秒）
# 开机后前 AGGRESSIVE_SECS 秒内每 AGGRESSIVE_STEP 秒巡检一次（对抗开机写回），
# 之后每 STEADY_INTERVAL 秒巡检一次（对抗解锁及运行期重置，开销极低）
AGGRESSIVE_SECS=180
AGGRESSIVE_STEP=3
STEADY_INTERVAL=30
